[workspace]
resolver = "2"
members = [
    "crates/scoplen-ssh",
    "crates/scoplen-model",
    "crates/scoplen-crypto",
    "crates/scoplen-api",
    "crates/scoplen-test-vectors",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
authors = ["Scoplen maintainers"]

[workspace.dependencies]
thiserror = "2.0.12"
unicode-normalization = "0.1.24"
uuid = { version = "=1.28.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Keep russh callbacks in the same async-trait form, including synchronous implementations.
unused_async_trait_impl = "allow"

[patch.crates-io]
# The published Pageant adapter lacks the bounded native WM_COPYDATA query and
# current-thread mapping names required by K-7. Retain that transport implementation.
pageant = { path = "vendor/pageant" }
