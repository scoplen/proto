[package]
name = "scoplen-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's versioned wire contracts and generated API types."

[features]
default = ["internal-grpc"]
internal-grpc = [
    "dep:prost",
    "dep:prost-types",
    "dep:tokio-stream",
    "dep:tonic",
    "dep:prost-build",
    "dep:protoc-bin-vendored",
    "dep:tonic-build",
]

[dependencies]
base64 = "0.22.1"
cedar-policy = "=4.4.0"
prost = { version = "=0.13.5", optional = true }
prost-types = { version = "=0.13.5", optional = true }
scoplen-model = { path = "../scoplen-model", version = "0.1.0" }
scoplen-crypto = { path = "../scoplen-crypto", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
sha2 = "0.10.9"
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "p256", "p384", "p521", "rsa", "std"] }
thiserror = "2.0.12"
tokio-stream = { version = "=0.1.19", features = ["net"], optional = true }
tonic = { version = "=0.13.1", features = ["transport", "tls-ring"], optional = true }
uuid.workspace = true

[build-dependencies]
prost-build = { version = "=0.13.5", optional = true }
protoc-bin-vendored = { version = "=3.2.0", optional = true }
tonic-build = { version = "=0.13.1", optional = true }

[dev-dependencies]
scoplen-test-vectors = { path = "../scoplen-test-vectors", version = "0.1.0" }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
