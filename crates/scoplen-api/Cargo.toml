[package]
name = "scoplen-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's versioned wire contracts and generated API types."

[dependencies]
base64 = "0.22.1"
cedar-policy = "=4.4.0"
prost = "=0.13.5"
prost-types = "=0.13.5"
scoplen-model = { path = "../scoplen-model", version = "0.1.0" }
scoplen-crypto = { path = "../scoplen-crypto", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "p256", "p384", "p521", "rsa", "std"] }
thiserror = "2.0.12"
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.13.1", features = ["transport", "tls-ring"] }
uuid.workspace = true

[build-dependencies]
prost-build = "=0.13.5"
protoc-bin-vendored = "=3.2.0"
tonic-build = "=0.13.1"

[dev-dependencies]
scoplen-test-vectors = { path = "../scoplen-test-vectors", version = "0.1.0" }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
