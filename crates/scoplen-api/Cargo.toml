[package]
name = "scoplen-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's versioned wire contracts and generated API types."

[dependencies]
prost = "=0.13.5"
prost-types = "=0.13.5"
scoplen-model = { path = "../scoplen-model", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.13.1", features = ["transport", "tls-ring"] }
uuid.workspace = true

[build-dependencies]
prost-build = "=0.13.5"
protoc-bin-vendored = "=3.2.0"
tonic-build = "=0.13.1"

[dev-dependencies]
cedar-policy = "=4.4.0"
scoplen-test-vectors = { path = "../scoplen-test-vectors", version = "0.1.0" }
tokio = { version = "1.44.2", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
