            "type": "string",
            "format": "date-time",
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9](\\.[0-9]+)?Z$",
            "description": "Valid UTC calendar date and time."
          },
          "updated_at": {
            "type": "string",
            "format": "date-time",
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9](\\.[0-9]+)?Z$",
            "description": "Valid UTC calendar date and time."
          },
          "data": {
            "type": "object",
            "required": ["certificate"],
            "additionalProperties": true,
            "properties": {
              "certificate": {
                "type": "string",
                "minLength": 1,
                "maxLength": 90112,
                "description": "Canonical ASCII single-line OpenSSH user certificate: exact algorithm, one space, padded standard Base64; no comments or other whitespace. Decoded complete binary blob is at most 65536 bytes."
              }
            }
          }
        }
      },
      "CertificateRequest": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/CertificateHostRequest"
          },
          {
            "$ref": "#/components/schemas/CertificateHostGroupRequest"
          }
        ]
      },
      "CertificateHostRequest": {
        "type": "object",
        "required": ["public_key", "hosts", "remote_user", "ttl_seconds"],
        "additionalProperties": false,
        "properties": {
          "public_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "description": "Canonical ASCII OpenSSH single-line raw public key: exact algorithm, one space, padded Base64 blob; no options, certificate, newline, or comment."
          },
          "hosts": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
            }
          },
          "remote_user": {
            "type": "string",
            "minLength": 1,
            "description": "1..255 UTF-8 bytes, no Unicode controls; preserved without trimming or normalization."
          },
          "ttl_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 86400
          }
        }
      },
      "CertificateHostGroupRequest": {
        "type": "object",
        "required": ["public_key", "host_groups", "remote_user", "ttl_seconds"],
        "additionalProperties": false,
        "properties": {
          "public_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "description": "Canonical ASCII OpenSSH single-line raw public key: exact algorithm, one space, padded Base64 blob; no options, certificate, newline, or comment."
          },
          "host_groups": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
            }
          },
          "remote_user": {
            "type": "string",
            "minLength": 1,
            "description": "1..255 UTF-8 bytes, no Unicode controls; preserved without trimming or normalization."
          },
          "ttl_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 86400
          }
        }
      },
      "GatewayTicketRequest": {
        "type": "object",
        "required": [
          "host",
          "remote_user",
          "ssh_public_key"
        ],
        "additionalProperties": false,
        "properties": {
          "host": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          },
          "remote_user": {
            "type": "string",
            "minLength": 1,
            "description": "1..255 UTF-8 bytes, no Unicode controls; preserved without trimming or normalization."
          },
          "ssh_public_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "description": "Canonical ASCII OpenSSH single-line raw public key: algorithm, one space, padded Base64 blob; no options, certificate, newline, or comment."
          }
        }
      },
      "GatewayEdgeAddress": {
        "type": "object",
        "required": [
          "host",
          "port"
        ],
        "additionalProperties": true,
        "properties": {
          "host": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253,
            "description": "Canonical IP address without brackets or lowercase A-label DNS name without a trailing dot; the DNS final label cannot be decimal-only or a 0x hexadecimal marker."
          },
          "port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535
          }
        }
      },
      "GatewayTicketResponse": {
        "type": "object",
        "required": [
          "ticket",
          "edge_addresses",
          "gateway_host_ca_public_key"
        ],
        "additionalProperties": true,
        "properties": {
          "ticket": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096,
            "description": "Opaque compact JWS of exactly three non-empty canonical unpadded base64url segments; decoding this response does not verify the ticket."
          },
          "edge_addresses": {
            "type": "array",
            "minItems": 1,
            "maxItems": 16,
            "description": "Preferred order; no duplicate host/port pair.",
            "items": {
              "$ref": "#/components/schemas/GatewayEdgeAddress"
            }
          },
          "gateway_host_ca_public_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "description": "Canonical ASCII OpenSSH single-line raw public key, as in GatewayTicketRequest.ssh_public_key."
          }
        }
      },
      "Resource": {
        "type": "object",
        "required": [
          "id",
          "etag",
          "created_at",
          "updated_at",
          "data"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "etag": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "data": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "Page": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "id",
                "etag",
                "created_at",
                "updated_at",
                "data"
              ],
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "etag": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 256
                },
                "created_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "updated_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "data": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "ProblemDetails": {
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "instance",
          "code",
          "changed",
          "retryable"
        ],
        "properties": {
          "type": {
            "type": "string",
            "minLength": 1
          },
          "title": {
            "type": "string",
            "minLength": 1
          },
          "status": {
            "type": "integer",
            "minimum": 100,
            "maximum": 599
          },
          "detail": {
            "type": "string",
            "minLength": 1
          },
          "instance": {
            "type": "string",
            "minLength": 1
          },
          "code": {
            "type": "string",
            "pattern": "^[a-z0-9_]+\\.[a-z0-9_]+$"
          },
          "changed": {
            "type": "boolean",
            "description": "False guarantees no business-state mutation from the failed operation; true means a mutation occurred or cannot be ruled out, not that success was established. Admission counters and failure-audit records are not business-state mutations."
          },
          "retryable": {
            "type": "boolean",
            "description": "Whether the same request may safely be retried; false forbids automatic replay."
          }
        },
        "additionalProperties": true
      },
      "PersonalRateLimitedProblem": {
        "allOf": [
          { "$ref": "#/components/schemas/ProblemDetails" },
          {
            "type": "object",
            "properties": {
              "status": { "const": 429 },
              "code": { "const": "auth.rate_limited" },
              "changed": { "const": false },
              "retryable": { "const": true }
            }
          }
        ]
      },
      "PersonalStorageUnavailableProblem": {
        "allOf": [
          { "$ref": "#/components/schemas/ProblemDetails" },
          { "type": "object", "properties": {
            "status": { "const": 503 },
            "code": { "const": "auth.storage_unavailable" },
            "changed": { "const": false },
            "retryable": { "const": true }
          } }
        ]
      },
      "PersonalCommitOutcomeUnknownProblem": {
        "allOf": [
          { "$ref": "#/components/schemas/ProblemDetails" },
          { "type": "object", "properties": {
            "status": { "const": 503 },
            "code": { "const": "auth.commit_outcome_unknown" },
            "changed": { "const": true },
            "retryable": { "const": false }
          } }
        ]
      },
      "DecisionRequest": {
        "type": "object",
        "required": [
          "decision"
        ],
        "properties": {
          "decision": {
            "type": "string",
            "enum": [
              "approve",
              "deny"
            ]
          },
          "reason": {
            "type": "string",
            "maxLength": 4096
          }
        }
      },
      "PolicyEvaluationRequest": {
        "type": "object",
        "required": [
          "action",
          "resource",
          "context"
        ],
        "properties": {
          "action": {
            "type": "string"
          },
          "resource": {
            "type": "object",
            "additionalProperties": true
          },
          "context": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "PolicyEvaluationResponse": {
        "type": "object",
        "required": [
          "decision",
          "policies"
        ],
        "properties": {
          "decision": {
            "type": "string",
            "enum": [
              "allow",
              "deny"
            ]
          },
          "policies": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Verification": {
        "type": "object",
        "required": [
          "valid"
        ],
        "properties": {
          "valid": {
            "type": "boolean"
          },
          "first_event": {
            "type": "string",
            "format": "uuid"
          },
          "last_event": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
    }
  }
}
