        "additionalProperties": false,
        "properties": {
          "device_id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          },
          "nonce": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "signature": {
            "type": "string",
            "description": "Lowercase hexadecimal fixed-width P-256 r || s signature of ASCII spl-auth-v1, UTF-8 canonical server origin, raw 32-byte nonce, and raw 16-byte device UUID, in that order.",
            "pattern": "^[0-9a-f]{128}$"
          }
        }
      },
      "AuthTokenResponse": {
        "type": "object",
