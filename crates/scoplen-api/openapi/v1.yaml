  "components": {
    "securitySchemes": {
      "accessToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "DPoP"
      },
      "dpopProof": {
        "type": "apiKey",
        "in": "header",
        "name": "DPoP"
      }
    },
    "parameters": {
      "org": {
        "name": "org",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "id": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 500,
          "default": 50
        }
      },
      "cursor": {
        "name": "cursor",
        "in": "query",
        "schema": {
          "type": "string",
          "maxLength": 512
        }
      },
      "ifMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "maxLength": 256
        }
      },
      "idempotency": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "maxLength": 256
        }
      }
    },
    "requestBodies": {
      "Write": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "required": [
                "data"
              ],
              "properties": {
                "data": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          }
        }
      }
    },
    "responses": {
      "Resource": {
        "description": "Resource",
        "headers": {
          "ETag": {
            "schema": {
              "type": "string"
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Resource"
            }
          }
        }
      },
      "Page": {
        "description": "Page",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Page"
            }
          }
        }
      },
      "Problem": {
        "description": "RFC 9457 problem details",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetails"
            }
          }
        }
      }
    },
    "schemas": {
      "AuthChallengeRequest": {
        "type": "object",
        "required": [
          "device_id"
        ],
        "additionalProperties": false,
        "properties": {
          "device_id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          }
        }
      },
      "AuthChallengeResponse": {
        "type": "object",
        "required": [
          "nonce",
          "server_time"
        ],
        "additionalProperties": true,
        "properties": {
          "nonce": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "server_time": {
            "type": "string",
            "format": "date-time",
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9](\\.[0-9]+)?Z$"
          }
        }
      },
      "AuthDeviceRequest": {
        "type": "object",
        "required": [
          "device_id",
          "nonce",
          "signature"
        ],
        "additionalProperties": false,
        "properties": {
          "device_id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          },
          "nonce": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "signature": {
            "type": "string",
            "description": "Lowercase hexadecimal fixed-width P-256 r || s signature of ASCII spl-auth-v1, UTF-8 canonical server origin, raw 32-byte nonce, and raw 16-byte device UUID, in that order.",
            "pattern": "^[0-9a-f]{128}$"
          }
        }
      },
      "AuthTokenResponse": {
        "type": "object",
        "required": [
          "access_token",
          "token_type",
          "expires_in",
          "refresh_token",
          "refresh_expires_in"
        ],
        "additionalProperties": true,
        "properties": {
          "access_token": {
            "type": "string",
            "minLength": 1
          },
          "token_type": {
            "type": "string",
            "const": "DPoP"
          },
          "expires_in": {
            "type": "integer",
            "minimum": 1
          },
          "refresh_token": {
            "type": "string",
            "minLength": 1
          },
          "refresh_expires_in": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "AuthRefreshRequest": {
        "type": "object",
        "required": [
          "refresh_token"
        ],
        "additionalProperties": false,
        "properties": {
          "refresh_token": {
            "type": "string",
            "minLength": 1,
            "description": "Opaque native refresh token, at most 2048 UTF-8 bytes; the complete encoded JSON body is at most 4096 bytes."
          }
        }
      },
      "BrowserAuthRefreshRequest": {
        "type": "object",
        "required": [],
        "additionalProperties": false,
        "properties": {},
        "description": "Exactly {}, accompanied by one endpoint-scoped __Secure-spl-refresh cookie."
      },
      "BrowserAuthTokenResponse": {
        "type": "object",
        "required": [
          "access_token",
          "token_type",
          "expires_in",
          "refresh_expires_in"
        ],
        "additionalProperties": true,
        "not": {
          "required": [
            "refresh_token"
          ]
        },
        "properties": {
          "access_token": {
            "type": "string",
            "minLength": 1
          },
          "token_type": {
            "type": "string",
            "const": "DPoP"
          },
          "expires_in": {
            "type": "integer",
            "minimum": 1
          },
          "refresh_expires_in": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "GatewayTicketRequest": {
        "type": "object",
        "required": [
          "host",
          "remote_user",
          "ssh_public_key"
        ],
        "additionalProperties": false,
        "properties": {
          "host": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          },
          "remote_user": {
            "type": "string",
            "minLength": 1,
            "description": "1..255 UTF-8 bytes, no Unicode controls; preserved without trimming or normalization."
          },
          "ssh_public_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "description": "Canonical ASCII OpenSSH single-line raw public key: algorithm, one space, padded Base64 blob; no options, certificate, newline, or comment."
          }
        }
      },
      "GatewayEdgeAddress": {
        "type": "object",
        "required": [
          "host",
          "port"
        ],
        "additionalProperties": true,
        "properties": {
          "host": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253,
            "description": "Canonical IP address without brackets or lowercase A-label DNS name without a trailing dot; the DNS final label cannot be decimal-only or a 0x hexadecimal marker."
          },
          "port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535
          }
        }
      },
      "GatewayTicketResponse": {
        "type": "object",
        "required": [
          "ticket",
          "edge_addresses",
          "gateway_host_ca_public_key"
        ],
        "additionalProperties": true,
        "properties": {
          "ticket": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096,
            "description": "Opaque compact JWS of exactly three non-empty canonical unpadded base64url segments; decoding this response does not verify the ticket."
          },
          "edge_addresses": {
            "type": "array",
            "minItems": 1,
            "maxItems": 16,
            "description": "Preferred order; no duplicate host/port pair.",
            "items": {
              "$ref": "#/components/schemas/GatewayEdgeAddress"
            }
          },
          "gateway_host_ca_public_key": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "description": "Canonical ASCII OpenSSH single-line raw public key, as in GatewayTicketRequest.ssh_public_key."
          }
        }
      },
      "Resource": {
        "type": "object",
        "required": [
          "id",
          "etag",
          "created_at",
          "updated_at",
          "data"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "etag": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "data": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "Page": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "id",
                "etag",
                "created_at",
                "updated_at",
                "data"
              ],
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "etag": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 256
                },
                "created_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "updated_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "data": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "next_cursor": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "ProblemDetails": {
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "instance",
          "code",
          "changed",
          "retryable"
        ],
        "properties": {
          "type": {
            "type": "string",
            "minLength": 1
          },
          "title": {
            "type": "string",
            "minLength": 1
          },
          "status": {
            "type": "integer",
            "minimum": 100,
            "maximum": 599
          },
          "detail": {
            "type": "string",
            "minLength": 1
          },
          "instance": {
            "type": "string",
            "minLength": 1
          },
          "code": {
            "type": "string",
            "pattern": "^[a-z0-9_]+\\.[a-z0-9_]+$"
          },
          "changed": {
            "type": "boolean"
          },
          "retryable": {
            "type": "boolean"
          }
        },
        "additionalProperties": true
      },
      "DecisionRequest": {
        "type": "object",
        "required": [
          "decision"
        ],
        "properties": {
          "decision": {
            "type": "string",
            "enum": [
              "approve",
              "deny"
            ]
          },
          "reason": {
            "type": "string",
            "maxLength": 4096
          }
        }
      },
      "PolicyEvaluationRequest": {
        "type": "object",
        "required": [
          "action",
          "resource",
          "context"
        ],
        "properties": {
          "action": {
            "type": "string"
          },
          "resource": {
            "type": "object",
            "additionalProperties": true
          },
          "context": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "PolicyEvaluationResponse": {
        "type": "object",
        "required": [
          "decision",
          "policies"
        ],
        "properties": {
          "decision": {
            "type": "string",
            "enum": [
              "allow",
              "deny"
            ]
          },
          "policies": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Verification": {
        "type": "object",
        "required": [
          "valid"
        ],
        "properties": {
          "valid": {
            "type": "boolean"
          },
          "first_event": {
            "type": "string",
            "format": "uuid"
          },
          "last_event": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
    }
  }
