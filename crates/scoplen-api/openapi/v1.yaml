{
  "openapi": "3.1.0",
  "info": {
    "title": "Scoplen Control Plane API",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "accessToken": [],
      "dpopProof": []
    }
  ],
  "paths": {
    "/.well-known/jwks.json": {
      "get": {
        "operationId": "getAuthJwks",
        "servers": [
          {
            "url": "/"
          }
        ],
        "security": [],
        "description": "Public dedicated enrolled-device access-token key discovery from the trusted deployment origin, outside /api/v1. This does not establish verification trust or authorize token-directed key retrieval.",
        "responses": {
          "200": {
            "description": "One active and optionally one unexpired overlap public Ed25519 key, ordered by kid; complete UTF-8 JSON at most 4096 bytes.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthJwks"
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/AuthJwksUnavailable"
          }
        }
      }
    },
    "/auth/challenge": {
      "post": {
        "operationId": "createAuthChallenge",
        "security": [],
        "requestBody": {
          "required": true,
          "description": "Encoded UTF-8 body must not exceed 256 bytes.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AuthChallengeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "A one-use challenge with the same shape for enrolled and unknown devices.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthChallengeResponse"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "403": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "413": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "415": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "429": {
            "$ref": "#/components/responses/AuthRateLimited"
          },
          "503": {
            "$ref": "#/components/responses/AuthStorageUnavailable"
          },
          "default": {
            "$ref": "#/components/responses/AuthProblem"
          }
        },
        "description": "Device-bound 120-second one-use nonce. Authorization, DPoP, refresh credentials, and Idempotency-Key are forbidden. A supplied Origin must match the configured deployment origin. Unknown and enrolled devices receive the same shape; multiple challenges may coexist. A lost response or uncertain challenge write permits a fresh challenge. Durable source admission precedes body parsing; private device and verified-account quotas never use unverified account ids. Malformed requests use 400 auth.invalid_request, excess bodies 413 auth.invalid_request, wrong content type 415 auth.invalid_request, and foreign Origin 403 policy.denied, all changed=false and retryable=false. Mandatory admission or failure-audit storage failure takes precedence. Every success and failure uses Cache-Control: no-store and Pragma: no-cache. Problems include an instance request id and no credential values."
      }
    },
    "/auth/device": {
      "post": {
        "operationId": "authenticateDevice",
        "x-scoplen-initial-device-scope": "account:read keys:read keys:write orgs:create orgs:read sync:read sync:write",
        "security": [],
        "requestBody": {
          "required": true,
          "description": "Encoded UTF-8 body must not exceed 4096 bytes, including whitespace.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AuthDeviceRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "DPoP-bound access and refresh tokens. The server issues exactly account:read keys:read keys:write orgs:create orgs:read sync:read sync:write after checking the current active account, enrolled device, and certificate. Request bodies cannot propose scopes. The refresh family records this initial permission ceiling. Scopes do not grant operator, browser, or service-principal rights and do not replace current-state or resource authorization.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthTokenResponse"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "401": {
            "$ref": "#/components/responses/AuthAuthenticationRequired"
          },
          "403": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "413": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "415": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "429": {
            "$ref": "#/components/responses/AuthRateLimited"
          },
          "503": {
            "$ref": "#/components/responses/AuthStorageFailure"
          },
          "default": {
            "$ref": "#/components/responses/AuthProblem"
          }
        },
        "description": "Authorization, DPoP, refresh credentials, and Idempotency-Key are forbidden. A supplied Origin must match the configured deployment origin. The first structurally valid attempt with a live bound nonce consumes it, including an invalid signature; nonce consumption and denial audit commit together. Success commits the nonce, initial 30-day refresh family, and success audit after signing the complete response. No token is returned before confirmed commit. Durable source admission precedes body parsing; private device and verified-account quotas never use unverified account ids. Malformed requests use 400 auth.invalid_request, excess bodies 413 auth.invalid_request, wrong content type 415 auth.invalid_request, and foreign Origin 403 policy.denied, all changed=false and retryable=false. Mandatory admission or failure-audit storage failure takes precedence. Every success and failure uses Cache-Control: no-store and Pragma: no-cache. Problems include an instance request id and no credential values."
      }
    },
    "/auth/refresh": {
      "post": {
        "operationId": "refreshAuthentication",
        "description": "Scoplen JSON refresh profile (not the OAuth form-encoded token endpoint). Exactly one DPoP proof is required without an access token. Native callers supply a body token; browser callers supply an empty body and one endpoint-scoped HttpOnly refresh cookie. Mixed or absent credentials, Authorization and Idempotency-Key headers are rejected. Browser Origin must match the configured console origin. All responses use Cache-Control: no-store and Pragma: no-cache. Proof, cookie, Origin, atomic rotation, and family-reuse checks are server responsibilities. Durable source admission precedes body parsing; private device and verified-account quotas never use unverified account ids. Malformed requests use 400 auth.invalid_request, excess bodies 413 auth.invalid_request, wrong content type 415 auth.invalid_request, and foreign Origin 403 policy.denied, all changed=false and retryable=false. Mandatory admission or failure-audit storage failure takes precedence. Every success and failure uses Cache-Control: no-store and Pragma: no-cache. Problems include an instance request id and no credential values. Operator families are browser-cookie only: a native/body credential must return generic 401 auth.authentication_required changed=false retryable=false without rotation or revocation. Verify against the separate Operator JWT audience/type/key source and preserve or narrow its original personal-invitation:issue ceiling.",
        "security": [
          {
            "dpopProof": []
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Complete UTF-8 JSON body must not exceed 4096 bytes, including whitespace. Native refresh_token is limited to 2048 UTF-8 bytes; browser body is exactly {}.",
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/AuthRefreshRequest"
                  },
                  {
                    "$ref": "#/components/schemas/BrowserAuthRefreshRequest"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "A rotated DPoP-bound token pair. Browser responses omit refresh_token and rotate it only through Set-Cookie: __Secure-spl-refresh with Path=/api/v1/auth/refresh, HttpOnly, Secure, SameSite=Strict, no Domain, and Max-Age=refresh_expires_in. The refresh family expires absolutely 30 days after initial authentication/bootstrap; rotation does not extend it. Return 600 access seconds and the remaining family whole seconds rounded down; deny when fewer than one remains. For enrolled-device families, rotation may preserve or narrow the initially granted scope ceiling according to current server state, never widen it. If no scope remains, require reauthentication and issue no token. Resource and organization access is rechecked at use; browser profiles remain separate.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              },
              "Set-Cookie": {
                "description": "Required for browser mode and absent for native mode; contains the rotated refresh credential.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/AuthTokenResponse"
                    },
                    {
                      "$ref": "#/components/schemas/BrowserAuthTokenResponse"
                    }
                  ]
                }
              }
            }
          },
          "400": {
            "description": "RFC 9457 problem. A required or stale DPoP nonce uses auth.use_dpop_nonce and includes DPoP-Nonce; malformed requests or other proof failures use auth.invalid_request or auth.invalid_dpop_proof. auth.invalid_request and auth.invalid_dpop_proof have changed=false and retryable=false; auth.use_dpop_nonce has changed=false and retryable=true and requires a new proof and jti.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              },
              "DPoP-Nonce": {
                "description": "Required only for auth.use_dpop_nonce; retry with a new proof and jti without consuming the refresh token.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetails"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/AuthAuthenticationRequired"
          },
          "403": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "413": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "415": {
            "$ref": "#/components/responses/AuthProblem"
          },
          "429": {
            "$ref": "#/components/responses/AuthRateLimited"
          },
          "503": {
            "$ref": "#/components/responses/AuthStorageFailure"
          },
          "default": {
            "$ref": "#/components/responses/AuthProblem"
          }
        }
      }
    },
    "/accounts/me": {
      "get": {
        "operationId": "getCurrentAccount",
        "x-scoplen-required-device-scope": "account:read",
        "description": "Current authenticated account profile. Complete response body is at most 4096 bytes, including whitespace, escapes, and extensions. Duplicate JSON names are invalid at every depth. The enrolled-device profile requires exact account:read after signature, DPoP, replay, and current account/device checks and before protected resource access. A missing scope returns 403 policy.denied, changed=false and retryable=false, without disclosing resource existence. There are no wildcard, prefix, role-name, or implied read-from-write matches; unknown scopes grant no registered rights and unmapped protected routes fail closed. The scope does not replace account ownership or operation policy.",
        "responses": {
          "200": {
            "description": "Current account Resource; HTTP ETag exactly equals body etag.",
            "headers": {
              "ETag": {
                "required": true,
                "description": "Strong entity tag exactly equal to the body etag.",
                "schema": {
                  "type": "string",
                  "minLength": 2,
                  "maxLength": 256,
                  "pattern": "^\"[!#-~]*\"$"
                }
              },
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AccountProfile"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/accounts/me/devices": {
      "get": {
        "operationId": "listCurrentAccountDevices",
        "x-scoplen-required-device-scope": "account:read",
        "x-scoplen-response-max-bytes": 6291456,
        "x-scoplen-decoded-artifact-max-bytes": 4194304,
        "description": "D-113 complete, consistent current-account K-2 signed-statement snapshot. Requires an enrolled-device access token, exact account:read, fresh token-bound DPoP, durable replay protection and current account/device/certificate authorization. Only verified identity selects the account; Operator, browser and service principals are refused. Origin, if present, must equal the trusted deployment origin. Reject every query, a nonempty body, Idempotency-Key and If-Match. No pagination, ETag, revision or conditional 304. Complete JSON including whitespace, escapes and ignored extensions is at most 6291456 bytes; combined decoded artifacts at most 4194304 bytes. Reject duplicate JSON names recursively. Consumers bind the expected account, decode every K-2 artifact, verify every account signature and certificate account binding using the already trusted account key, reject repeated device ids within each array, apply every revocation and sort active certificates by UUID before displaying anything. A device id may occur once in each array; a revocation may name an absent certificate. Valid signatures do not prove completeness or freshness. Signed metadata is not server admission or hardware attestation. Missing key state, corrupt stored statements or unencodable full sets fail wholly with 503; never truncate.",
        "responses": {
          "200": {
            "description": "Complete signed-statement snapshot, with empty arrays when appropriate. The container itself has no new signature.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AccountDeviceStatements"
                }
              }
            }
          },
          "400": {
            "description": "Malformed or forbidden request input; no collection details.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/ProblemDetails"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "status": {
                          "const": 400
                        },
                        "code": {
                          "const": "auth.invalid_request"
                        },
                        "changed": {
                          "const": false
                        },
                        "retryable": {
                          "const": false
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid credentials or current identity; existing enrolled-device authentication failure profile. changed=false and retryable=false.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetails"
                }
              }
            }
          },
          "403": {
            "description": "Missing exact account:read scope, disallowed principal or Origin; no collection details.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/ProblemDetails"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "status": {
                          "const": 403
                        },
                        "code": {
                          "const": "policy.denied"
                        },
                        "changed": {
                          "const": false
                        },
                        "retryable": {
                          "const": false
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "503": {
            "description": "Required account-key state is missing, stored statements are corrupt, or the complete consistent set exceeds transport bounds. No partial success.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/ProblemDetails"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "status": {
                          "const": 503
                        },
                        "code": {
                          "const": "auth.storage_unavailable"
                        },
                        "changed": {
                          "const": false
                        },
                        "retryable": {
                          "const": true
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "default": {
            "description": "Existing DPoP, nonce and authentication failure profiles; changed=false and retryable=false. No collection details.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "const": "no-store"
                }
              },
              "Pragma": {
                "required": true,
                "schema": {
                  "const": "no-cache"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetails"
                }
              }
            }
          }
        }
      }
    },
    "/orgs/{org}": {
      "get": {
        "operationId": "getCurrentAccountOrganization",
        "x-scoplen-required-device-scope": "orgs:read",
        "x-scoplen-response-max-bytes": 4096,
