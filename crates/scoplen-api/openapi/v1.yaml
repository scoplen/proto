      },
      "Page": {
        "description": "Page",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Page"
            }
          }
        }
      },
      "Problem": {
        "description": "RFC 9457 problem details",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetails"
            }
          }
        }
      },
      "PersonalRateLimited": {
        "description": "Personal admission rejected without invitation or identity mutation. Retry-After is the latest applicable admission delay, rounded up to a decimal 1..300 seconds; retrying then does not guarantee admission. RateLimit and RateLimit-Policy use draft-ietf-httpapi-ratelimit-headers-11 structured-field syntax and reveal only the nominal source policy, never a private bucket or key.",
        "headers": {
          "Retry-After": { "required": true, "schema": { "type": "string", "pattern": "^(?:[1-9]|[1-9][0-9]|[12][0-9]{2}|300)$" } },
          "RateLimit-Policy": { "required": true, "schema": { "const": "\"personal\";q=30;w=60" } },
          "RateLimit": { "required": true, "schema": { "type": "string", "pattern": "^\"personal\";r=0;t=(?:[1-9]|[1-9][0-9]|[12][0-9]{2}|300)$" }, "description": "The t delay equals Retry-After." },
          "Cache-Control": { "required": true, "schema": { "const": "no-store" } },
          "Pragma": { "required": true, "schema": { "const": "no-cache" } },
          "Referrer-Policy": { "required": true, "schema": { "const": "no-referrer" } }
        },
        "content": {
          "application/problem+json": {
            "schema": { "$ref": "#/components/schemas/PersonalRateLimitedProblem" }
          }
        }
      },
      "PersonalStorageFailure": {
        "description": "A known precommit failure returns auth.storage_unavailable with changed=false and retryable=true. If COMMIT was attempted and its outcome cannot be confirmed, return auth.commit_outcome_unknown with changed=true and retryable=false; never automatically replay either Personal POST after an unknown outcome. For enrollment, retain local keys and ids and first try /auth/challenge and /auth/device. For invitation issuance, the one-time token may be unrecoverable; the operator explicitly decides whether to issue another invitation. An ordinary absent row or failed read does not prove rollback while a commit may be in flight.",
        "headers": {
          "Cache-Control": { "required": true, "schema": { "const": "no-store" } },
          "Pragma": { "required": true, "schema": { "const": "no-cache" } },
          "Referrer-Policy": { "required": true, "schema": { "const": "no-referrer" } }
        },
        "content": {
          "application/problem+json": {
            "schema": { "oneOf": [
              { "$ref": "#/components/schemas/PersonalStorageUnavailableProblem" },
              { "$ref": "#/components/schemas/PersonalCommitOutcomeUnknownProblem" }
            ] }
          }
        }
      }
    },
    "schemas": {
      "PersonalInvitationRequest": {
        "type": "object",
        "required": [],
        "additionalProperties": false,
        "properties": {}
      },
      "PersonalInvitationResponse": {
        "type": "object",
        "required": ["invitation_url", "expires_at"],
        "additionalProperties": true,
        "properties": {
          "invitation_url": {
            "type": "string",
            "maxLength": 2105,
            "description": "Canonical HTTPS deployment origin plus /invite#token= and exactly 43 canonical unpadded base64url characters encoding 32 random bytes. The fragment is a bearer credential."
          },
          "expires_at": {
            "type": "string",
            "format": "date-time",
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9](\\.[0-9]+)?Z$"
          }
        }
      },
      "PersonalEnrollmentRequest": {
        "type": "object",
        "required": ["invitation_token", "account_id", "personal_vault_id", "account_signing_public_key", "account_kem_public_key", "key_bundle_update", "device_certificate", "wrapped_personal_vault_key", "device_signature"],
        "additionalProperties": false,
        "properties": {
          "invitation_token": { "type": "string", "minLength": 43, "maxLength": 43, "pattern": "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$", "description": "Canonical unpadded base64url of exactly 32 invitation-token bytes." },
          "account_id": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" },
          "personal_vault_id": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" },
          "account_signing_public_key": { "type": "string", "minLength": 43, "maxLength": 43, "pattern": "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$", "description": "Canonical unpadded base64url of exactly 32 raw Ed25519 public-key bytes." },
          "account_kem_public_key": { "type": "string", "minLength": 43, "maxLength": 43, "pattern": "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$", "description": "Canonical unpadded base64url of exactly 32 raw X25519 public-key bytes." },
          "key_bundle_update": { "type": "string", "minLength": 1, "maxLength": 1048576, "description": "Canonical unpadded base64url of the exact deterministic K-4 CBOR key-bundle-update at revision 1 with one device wrap and account signature. Existing K-4 artifact bounds apply." },
          "device_certificate": { "type": "string", "minLength": 1, "maxLength": 87382, "description": "Canonical unpadded base64url of the exact deterministic K-2 signed device certificate, at most 65536 decoded bytes." },
          "wrapped_personal_vault_key": { "type": "string", "minLength": 2, "maxLength": 87382, "description": "Canonical unpadded base64url of 1..65536 opaque bytes wrapping the epoch-1 Personal vault key to the ARK." },
          "device_signature": { "type": "string", "minLength": 86, "maxLength": 86, "pattern": "^[A-Za-z0-9_-]{85}[AQgw]$", "description": "Canonical unpadded base64url of the fixed-width 64-byte P-256 r || s possession signature over the D-101 input." }
        }
      },
      "PersonalEnrollmentResponse": {
        "type": "object",
        "required": ["account_id", "device_id", "personal_vault_id"],
        "additionalProperties": true,
        "properties": {
          "account_id": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" },
          "device_id": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" },
          "personal_vault_id": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" }
        }
      },
      "AuthChallengeRequest": {
        "type": "object",
        "required": [
          "device_id"
        ],
        "additionalProperties": false,
        "properties": {
          "device_id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          }
        }
      },
      "AuthChallengeResponse": {
        "type": "object",
        "required": [
