            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/auth/refresh": {
      "post": {
        "operationId": "refreshAuthentication",
        "description": "Scoplen JSON refresh profile (not the OAuth form-encoded token endpoint). Exactly one DPoP proof is required without an access token. Native callers supply a body token; browser callers supply an empty body and one endpoint-scoped HttpOnly refresh cookie. Mixed or absent credentials, Authorization and Idempotency-Key headers are rejected. Browser Origin must match the configured console origin. All responses use Cache-Control: no-store and Pragma: no-cache. Proof, cookie, Origin, atomic rotation, and family-reuse checks are server responsibilities.",
        "security": [
          {
            "dpopProof": []
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Complete UTF-8 JSON body must not exceed 4096 bytes, including whitespace. Native refresh_token is limited to 2048 UTF-8 bytes; browser body is exactly {}.",
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/AuthRefreshRequest"
                  },
                  {
                    "$ref": "#/components/schemas/BrowserAuthRefreshRequest"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "A rotated DPoP-bound token pair. Browser responses omit refresh_token and rotate it only through Set-Cookie: __Secure-spl-refresh with Path=/api/v1/auth/refresh, HttpOnly, Secure, SameSite=Strict, no Domain, and Max-Age=refresh_expires_in.",
            "headers": {
              "Set-Cookie": {
                "description": "Required for browser mode and absent for native mode; contains the rotated refresh credential.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/AuthTokenResponse"
                    },
                    {
                      "$ref": "#/components/schemas/BrowserAuthTokenResponse"
                    }
                  ]
                }
              }
            }
          },
          "400": {
            "description": "RFC 9457 problem. A required or stale DPoP nonce uses auth.use_dpop_nonce and includes DPoP-Nonce; malformed requests or other proof failures use auth.invalid_request or auth.invalid_dpop_proof.",
            "headers": {
              "DPoP-Nonce": {
                "description": "Required only for auth.use_dpop_nonce; retry with a new proof and jti without consuming the refresh token.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetails"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Problem"
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "413": {
            "$ref": "#/components/responses/Problem"
          },
          "415": {
            "$ref": "#/components/responses/Problem"
          },
          "default": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
