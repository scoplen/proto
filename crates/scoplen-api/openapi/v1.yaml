  "paths": {
    "/admin/personal-invitations": {
      "post": {
        "operationId": "issuePersonalInvitation",
        "description": "Authenticated deployment operator only; organization roles do not grant authority. Idempotency-Key is forbidden. Each authorized POST creates a fresh 24-hour invitation. The response contains a one-use bearer URL and must not be logged or replayed. Durable source admission precedes body parsing; authenticated operator admission applies only after authentication. If durable admission or mandatory failure auditing cannot commit, 503 auth.storage_unavailable takes precedence over an otherwise applicable 400, 401, 403, 413, 415, or 429 without identity mutation.",
        "requestBody": {
          "required": true,
          "description": "Exactly {} as application/json; complete UTF-8 body at most 256 bytes, including whitespace.",
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/PersonalInvitationRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "One-time invitation; complete encoded response at most 4096 bytes.",
            "headers": {
              "Cache-Control": { "required": true, "schema": { "const": "no-store" } },
              "Pragma": { "required": true, "schema": { "const": "no-cache" } },
              "Referrer-Policy": { "required": true, "schema": { "const": "no-referrer" } }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PersonalInvitationResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Problem" },
          "401": { "$ref": "#/components/responses/Problem" },
          "403": { "$ref": "#/components/responses/Problem" },
          "413": { "$ref": "#/components/responses/Problem" },
          "415": { "$ref": "#/components/responses/Problem" },
          "429": { "$ref": "#/components/responses/PersonalRateLimited" },
          "503": { "$ref": "#/components/responses/PersonalStorageFailure" },
          "default": { "$ref": "#/components/responses/Problem" }
        }
      }
    },
    "/auth/personal-enroll": {
      "post": {
        "operationId": "enrollPersonalDevice",
        "security": [],
        "description": "First-device Personal enrollment requires a one-use invitation and possession proof. Authorization, DPoP, and Idempotency-Key headers are forbidden. Origin, when present, must equal the trusted canonical HTTPS deployment origin. The server verifies both artifact signatures, invitation state, unique ids, and atomic account creation; structural decoding alone does not verify signatures. Malformed CBOR or fields return 400 auth.invalid_request; mismatched account/certificate/wrap identity or rejected proofs return 401 auth.enrollment_denied without an invitation-validity signal. Credentialed cross-origin requests are forbidden. Durable source admission precedes body parsing; decoded invitation-digest admission follows structural and origin/header validation without testing token existence. If durable admission or mandatory failure auditing cannot commit, 503 auth.storage_unavailable takes precedence over an otherwise applicable 400, 401, 403, 413, 415, or 429 without invitation or identity mutation.",
        "requestBody": {
          "required": true,
          "description": "Complete application/json UTF-8 body at most 1048576 bytes, including whitespace and escapes.",
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/PersonalEnrollmentRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created Personal account and first device; complete encoded response at most 256 bytes. This is not an authentication token.",
            "headers": {
              "Cache-Control": { "required": true, "schema": { "const": "no-store" } },
              "Pragma": { "required": true, "schema": { "const": "no-cache" } }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PersonalEnrollmentResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Problem" },
          "401": { "$ref": "#/components/responses/Problem" },
          "403": { "$ref": "#/components/responses/Problem" },
          "413": { "$ref": "#/components/responses/Problem" },
          "415": { "$ref": "#/components/responses/Problem" },
          "429": { "$ref": "#/components/responses/PersonalRateLimited" },
          "503": { "$ref": "#/components/responses/PersonalStorageFailure" },
          "default": { "$ref": "#/components/responses/Problem" }
        }
      }
    },
