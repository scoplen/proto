          },
          "etag": {
            "type": "string",
            "minLength": 2,
            "maxLength": 256,
            "pattern": "^\"[!#-~]*\"$",
            "description": "Strong ASCII HTTP entity tag including double quotes; exactly matches the ETag response header."
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9](\\.[0-9]+)?Z$",
            "description": "Valid UTC calendar date and time."
          },
          "updated_at": {
            "type": "string",
            "format": "date-time",
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9](\\.[0-9]+)?Z$",
            "description": "Valid UTC calendar date and time."
          },
          "data": {
            "type": "object",
            "required": ["email"],
            "additionalProperties": true,
            "properties": {
              "email": {
                "type": ["string", "null"],
                "minLength": 1,
                "maxLength": 320,
                "description": "Null when no email exists. A present value is at most 320 UTF-8 bytes, nonempty, with no Unicode control or whitespace characters; the exact string is preserved."
              }
            }
          }
        }
      },
      "CertificateIssuanceResponse": {
        "type": "object",
        "required": ["id", "etag", "created_at", "updated_at", "data"],
