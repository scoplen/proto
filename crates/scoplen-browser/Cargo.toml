[package]
name = "scoplen-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's thin browser bindings over shared password, invitation and policy contracts."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scoplen-api = { path = "../scoplen-api", version = "0.1.0", default-features = false }
scoplen-crypto = { path = "../scoplen-crypto", version = "0.1.0" }
scoplen-model = { path = "../scoplen-model", version = "0.1.0" }
uuid.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom03 = { package = "getrandom", version = "=0.3.4", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }
js-sys = "=0.3.106"
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
scoplen-test-vectors = { path = "../scoplen-test-vectors", version = "0.1.0" }
serde_json = "1.0.140"

[lints]
workspace = true
