[package]
name = "scoplen-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoplen's shared SSH protocol core."

[lints]
workspace = true

[dependencies]
scoplen-api = { path = "../scoplen-api", version = "0.1.0" }
scoplen-crypto = { path = "../scoplen-crypto", version = "0.1.0" }
russh = { version = "=0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
pageant = "=0.2.2"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "getrandom", "p256", "rsa", "std"] }
signature = "3.0.0"
thiserror.workspace = true
tokio = { version = "1.17.0", features = ["io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
zeroize = "1.8"
