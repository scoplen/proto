name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check OpenAPI generated types
        run: node crates/scoplen-api/openapi/generate.mjs --check
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build and replay fuzz corpus
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo +nightly install cargo-fuzz --locked
          for target in vector_loader object_decoder crypto_decoders agent_decoder sftp_decoder ssh_protocol sync_notification sync_control sync_data api_json; do
            test -n "$(find "fuzz/corpus/$target" -maxdepth 1 -type f -name 'seed-*' -print -quit)"
            cargo +nightly fuzz run "$target" "fuzz/corpus/$target" -- -runs=0 -timeout=10
          done

  dependency-audit:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install cargo-deny and cargo-audit
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-deny --locked
          cargo +stable install cargo-audit --locked
      - name: Cargo deny
        run: cargo deny check
      - name: Cargo audit
        # RUSTSEC-2023-0071 has no patched RSA release; the same exception is
        # recorded in deny.toml and must stay visible until upstream is fixed.
        run: cargo audit --ignore RUSTSEC-2023-0071

  dropbear-interop:
    name: Dropbear interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Password, rejected password, and host-key pin
        shell: pwsh
        run: ./scripts/dropbear-interop.ps1

  openssh-interop:
    name: OpenSSH client interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authentication, certificates, SFTP, and routes
        shell: pwsh
        run: ./scripts/openssh-interop.ps1
      - name: Current OpenSSH authentication, certificates, SFTP, and routes
        shell: pwsh
        run: ./scripts/openssh-interop.ps1 -ServerVersion 10.6p1
      - name: OpenSSH 8.8p1 authentication, certificates, SFTP, and routes
        shell: pwsh
        run: ./scripts/openssh-8-interop.ps1
      - name: Constrained RSA signature advertisements and authentication
        shell: pwsh
        run: ./scripts/ssh-rsa-selection-interop.ps1
      - name: P-384 and P-521 host keys and host certificates
        shell: pwsh
        run: ./scripts/ssh-host-certificate-interop.ps1
      - name: Real OpenSSH agent raw-key and user-certificate authentication
        shell: pwsh
        run: ./scripts/ssh-agent-interop.ps1
      - name: Remote TCP and Unix socket forwarding, cancellation, and denial
        shell: pwsh
        run: ./scripts/ssh-remote-forwarding-interop.ps1
      - name: Established channel EOF, reset, keepalive loss, and normal termination
        shell: pwsh
        run: ./scripts/ssh-network-loss-interop.ps1

  openssh-agent-unix:
    name: Native Unix OpenSSH agent interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Raw-key and user-certificate authentication over an agent Unix socket
        shell: pwsh
        run: ./scripts/ssh-agent-unix-interop.ps1

  openssh-agent-windows:
    name: Native Windows OpenSSH agent interoperability
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Start Windows OpenSSH agent
        shell: pwsh
        run: |
          Set-Service -Name ssh-agent -StartupType Manual
          Start-Service -Name ssh-agent
      - name: Raw-key authentication over the native agent pipe and disposable SSH server
        shell: pwsh
        run: ./scripts/ssh-agent-windows-interop.ps1

  openssh-agent-forwarded:
    name: Forwarded OpenSSH agent interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Second-hop authentication and fail-closed forwarded-agent policy
        shell: pwsh
        run: ./scripts/ssh-agent-forwarded-interop.ps1

  openssh-algorithms:
    name: OpenSSH algorithm policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Constrained algorithms, Host isolation, strict KEX, and repeated rekey
        shell: pwsh
        run: ./scripts/ssh-algorithm-interop.ps1
      - name: Explicit per-Host 3DES and default rejection
        shell: pwsh
        run: ./scripts/ssh-algorithm-interop.ps1 -LegacyCipher 3des-cbc

  openssh-modern-matrix:
    name: OpenSSH modern algorithm matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Constrained KEX, cipher, ETM MAC, and delayed compression
        shell: pwsh
        run: ./scripts/ssh-modern-algorithm-interop.ps1
