name: check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FUZZ_TOOLCHAIN: nightly-2026-10-26

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check OpenAPI generated types
        run: node crates/scoplen-api/openapi/generate.mjs --check
      - name: Test Operator OpenAPI contract checks
        run: node --test crates/scoplen-api/openapi/generate-operator.test.mjs
      - name: Test Account entry OpenAPI contract checks
        run: node --test crates/scoplen-api/openapi/generate-account-admission.test.mjs
      - name: Test Account browser OpenAPI contract checks
        run: node --test crates/scoplen-api/openapi/generate-account-browser.test.mjs
      - name: Test browser and user-CA public TypeScript contracts
        run: >-
          npm exec --yes --package typescript@5.9.3 --
          tsc --strict --noEmit --target es2022 --module esnext --moduleResolution bundler
          crates/scoplen-api/openapi/account-browser.types.test.ts
          crates/scoplen-api/openapi/user-ca-krl.types.test.ts
      - name: Check Account browser vectors and parser bounds
        run: node scripts/generate-account-browser-vectors.mjs --check
      - name: Check Account entry vectors and parser bounds
        run: node scripts/generate-account-admission-vectors.mjs --check
      - name: Test team creation and discovery OpenAPI contract checks
        run: node --test crates/scoplen-api/openapi/generate-organizations.test.mjs
      - name: Check team creation and discovery vectors and parser bounds
        run: node scripts/generate-organization-vectors.mjs --check
      - name: Test independent team vector producer and checkout bounds
        run: node --test scripts/generate-organization-vectors.test.mjs
      - name: Test team membership OpenAPI contract checks
        run: node --test crates/scoplen-api/openapi/generate-team.test.mjs
      - name: Test group and policy OpenAPI contract checks
        run: node --test crates/scoplen-api/openapi/generate-group-policy.test.mjs
      - name: Check group and policy vectors
        run: node scripts/generate-group-policy-vectors.mjs --check
      - name: Test independent group and policy vector producer
        run: node --test scripts/generate-group-policy-vectors.test.mjs
      - name: Check team invitation cryptographic and API vectors
        run: |
          node scripts/generate-team-invitation-vectors.mjs --check
          node scripts/generate-team-vectors.mjs --check
      - name: Test independent team invitation vector producers
        run: node --test scripts/generate-team-invitation-vectors.test.mjs scripts/generate-team-vectors.test.mjs
      - name: Check Organization view vectors and parser seeds
        run: node scripts/generate-organization-view-vectors.mjs --check
      - name: Test independent Organization view vector producer
        run: node --test scripts/generate-organization-view-vectors.test.mjs
      - name: Check public user-CA vectors and parser seeds
        run: node scripts/generate-user-ca-vectors.mjs --check
      - name: Check user-CA revocation vectors
        run: node scripts/generate-user-ca-krl-vectors.mjs --check
      - name: Check certificate problem vectors
        run: node scripts/generate-certificate-problem-vectors.mjs --check
      - name: Test certificate problem vector preservation
        run: node --test scripts/generate-certificate-problem-vectors.test.mjs
      - name: Test user-CA KRL producer and OpenSSH queries
        run: node --test scripts/generate-user-ca-krl-vectors.test.mjs scripts/user-ca-krl-openssh.test.mjs
      - name: Test public user-CA contracts and independent producer
        run: node --test crates/scoplen-api/openapi/generate-user-ca*.test.mjs scripts/generate-user-ca-vectors.test.mjs
      - name: Check used Account-id digest vectors
        run: node scripts/generate-account-used-id-vectors.mjs --check
      - name: Check typed Organization inventory contracts and vectors
        run: |
          node scripts/generate-inventory-vectors.mjs --check
          node --test scripts/generate-inventory-vectors.test.mjs crates/scoplen-api/openapi/generate-inventory.test.mjs
      - name: Check Operator logout vectors and parser bounds
        run: node scripts/generate-operator-logout-vectors.mjs --check
      - name: Test Operator logout vector checkout boundaries
        run: node --test scripts/generate-operator-logout-vectors.test.mjs
      - name: Check interactive credential vectors
        run: node scripts/generate-interactive-credential-vectors.mjs --check
      - name: Check password bootstrap vectors and parser seeds
        run: node scripts/generate-password-bootstrap-vectors.mjs --check
      - name: Test independent password bootstrap vector producer
        run: node --test scripts/generate-password-bootstrap-vectors.test.mjs
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build and replay fuzz corpus
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --component rust-src
          cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked
          for target in vector_loader object_decoder crypto_decoders agent_decoder sftp_decoder ssh_protocol sync_notification sync_control sync_data api_json; do
            test -n "$(find "fuzz/corpus/$target" -maxdepth 1 -type f -name 'seed-*' -print -quit)"
            cargo +"$FUZZ_TOOLCHAIN" fuzz run "$target" "fuzz/corpus/$target" -- -runs=0 -timeout=10
          done

  browser:
    name: Shared browser module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install browser system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang llvm
      - name: Install fixed browser tools
        run: |
          rustup target add --toolchain 1.99.0 wasm32-unknown-unknown
          cargo +1.99.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Test API without native gRPC transport
        run: cargo test --locked -p scoplen-api --no-default-features --lib
      - name: Check WASM bindings
        run: cargo clippy --locked --target wasm32-unknown-unknown -p scoplen-browser -- -D warnings
      - name: Build fixed browser package
        run: node scripts/build-browser.mjs
      - name: Check packaged module in Chromium
        run: node scripts/check-browser.mjs

  dependency-audit:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install cargo-deny and cargo-audit
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-deny --locked
          cargo +stable install cargo-audit --locked
      - name: Cargo deny
        run: cargo deny check
      - name: Cargo audit
        # RUSTSEC-2023-0071 has no patched RSA release; the same exception is
        # recorded in deny.toml and must stay visible until upstream is fixed.
        run: cargo audit --ignore RUSTSEC-2023-0071

  dropbear-interop:
    name: Dropbear interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Password, rejected password, and host-key pin
        shell: pwsh
        run: ./scripts/dropbear-interop.ps1
      - name: Mixed OpenSSH and Dropbear Jump depths one through three
        shell: pwsh
        run: ./scripts/ssh-mixed-jump-interop.ps1

  openssh-interop:
    name: OpenSSH client interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authentication, certificates, SFTP, and routes
        shell: pwsh
        run: ./scripts/openssh-interop.ps1
      - name: Current OpenSSH authentication, certificates, SFTP, and routes
        shell: pwsh
        run: ./scripts/openssh-interop.ps1 -ServerVersion 10.6p2
      - name: OpenSSH 8.8p1 authentication, certificates, SFTP, and routes
        shell: pwsh
        run: ./scripts/openssh-8-interop.ps1
      - name: Constrained RSA signature advertisements and authentication
        shell: pwsh
        run: ./scripts/ssh-rsa-selection-interop.ps1
      - name: P-384 and P-521 host keys and host certificates
        shell: pwsh
        run: ./scripts/ssh-host-certificate-interop.ps1
      - name: Real OpenSSH agent raw-key and user-certificate authentication
        shell: pwsh
        run: ./scripts/ssh-agent-interop.ps1
      - name: Pinned OpenSSH PAM keyboard-interactive authentication and rejection
        shell: pwsh
        run: ./scripts/ssh-keyboard-interactive-interop.ps1
      - name: Remote TCP and Unix socket forwarding, cancellation, and denial
        shell: pwsh
        run: ./scripts/ssh-remote-forwarding-interop.ps1
      - name: Established channel EOF, reset, keepalive loss, and normal termination
        shell: pwsh
        run: ./scripts/ssh-network-loss-interop.ps1

  openssh-agent-unix:
    name: Native Unix OpenSSH agent interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Raw-key and user-certificate authentication over an agent Unix socket
        shell: pwsh
        run: ./scripts/ssh-agent-unix-interop.ps1

  openssh-agent-windows:
    name: Native Windows OpenSSH agent interoperability
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Start Windows OpenSSH agent
        shell: pwsh
        run: |
          Set-Service -Name ssh-agent -StartupType Manual
          Start-Service -Name ssh-agent
      - name: Raw-key authentication over the native agent pipe and disposable SSH server
        shell: pwsh
        run: ./scripts/ssh-agent-windows-interop.ps1

  openssh-agent-forwarded:
    name: Forwarded OpenSSH agent interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Second-hop authentication and fail-closed forwarded-agent policy
        shell: pwsh
        run: ./scripts/ssh-agent-forwarded-interop.ps1

  openssh-algorithms:
    name: OpenSSH algorithm policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Constrained algorithms, Host isolation, strict KEX, and repeated rekey
        shell: pwsh
        run: ./scripts/ssh-algorithm-interop.ps1
      - name: Explicit per-Host 3DES and default rejection
        shell: pwsh
        run: ./scripts/ssh-algorithm-interop.ps1 -LegacyCipher 3des-cbc

  openssh-modern-matrix:
    name: OpenSSH modern algorithm matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Constrained KEX, cipher, ETM MAC, and delayed compression
        shell: pwsh
        run: ./scripts/ssh-modern-algorithm-interop.ps1
