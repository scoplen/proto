name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Fuzz target build
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
          cargo +nightly fuzz build vector_loader
          cargo +nightly fuzz build object_decoder
          cargo +nightly fuzz build crypto_decoders
          cargo +nightly fuzz build agent_decoder
          cargo +nightly fuzz build sftp_decoder
          cargo +nightly fuzz build ssh_protocol

  dependency-audit:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install cargo-deny and cargo-audit
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-deny --locked
          cargo +stable install cargo-audit --locked
      - name: Cargo deny
        run: cargo deny check
      - name: Cargo audit
        # RUSTSEC-2023-0071 has no patched RSA release; the same exception is
        # recorded in deny.toml and must stay visible until upstream is fixed.
        run: cargo audit --ignore RUSTSEC-2023-0071

  dropbear-interop:
    name: Dropbear interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Password, rejected password, and host-key pin
        shell: pwsh
        run: ./scripts/dropbear-interop.ps1

  openssh-interop:
    name: OpenSSH SFTP and routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: SFTP, forwarding, ProxyCommand, SOCKS, and rejected password
        shell: pwsh
        run: ./scripts/openssh-interop.ps1
