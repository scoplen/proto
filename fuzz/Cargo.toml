[package]
name = "scoplen-proto-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[patch.crates-io]
# Use the same bounded native Pageant transport as the main workspace.
pageant = { path = "../vendor/pageant" }

[dependencies]
libfuzzer-sys = "0.4.7"
scoplen-test-vectors = { path = "../crates/scoplen-test-vectors" }
scoplen-model = { path = "../crates/scoplen-model" }
scoplen-crypto = { path = "../crates/scoplen-crypto" }
scoplen-ssh = { path = "../crates/scoplen-ssh" }
scoplen-api = { path = "../crates/scoplen-api" }

[[bin]]
name = "vector_loader"
path = "fuzz_targets/vector_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "object_decoder"
path = "fuzz_targets/object_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypto_decoders"
path = "fuzz_targets/crypto_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_decoder"
path = "fuzz_targets/agent_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sftp_decoder"
path = "fuzz_targets/sftp_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_protocol"
path = "fuzz_targets/ssh_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sync_notification"
path = "fuzz_targets/sync_notification.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sync_control"
path = "fuzz_targets/sync_control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sync_data"
path = "fuzz_targets/sync_data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_json"
path = "fuzz_targets/api_json.rs"
test = false
doc = false
bench = false
